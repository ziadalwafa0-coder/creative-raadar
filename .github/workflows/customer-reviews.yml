name: Customer reviews pipeline
on:
  push:
    paths: ['backend/**', 'frontend/**', 'src/App.tsx', 'package*.json', '.github/workflows/customer-reviews.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'src/App.tsx', 'package*.json', '.github/workflows/customer-reviews.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix backend run check
      - run: npm --prefix backend test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_REVIEWS_API_URL: https://backend.invalid
